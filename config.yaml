defaults:
  author_name: "Your Name"
  auto_commit: true
  auto_push: false
  timestamp_format: "%Y-%m-%d_%H-%M-%S"
readme:
  title: "ShodhaSrota"
  description: "A project to document learning and sources."
paths:
  base_dir: "."
  categories:
    research: "Research"
    math: "Math"
    technologies: "Technologies"
    general: "General"
    books: "Books"
templates:
  research: "scripts/templates/research.md"
  math: "scripts/templates/math.md"
  technologies: "scripts/templates/technologies.md"
  general: "scripts/templates/general.md"
  books: "scripts/templates/books.md"
workflow:
  editor: "code" # Options: code, vim, nano, subl, etc
  auto_update_readme: true
  auto_commit_on_complete: true

  # AI draft generation settings
  ai_drafts:
    enabled: true
    # API keys required: Set GROQ_API_KEY and EXA_API_KEY in GitHub Secrets
    schedule: "0 20 * * 0" # Cron: Sunday 8 PM UTC (min hour day month weekday)

    # Model configuration
    groq:
      model: "llama-3.3-70b-versatile"
      temperature: 0.7
      max_tokens: 4096

    exa:
      num_results_per_query: 5
      search_type: "neural"
      max_characters: 3000

    # Generation settings
    max_search_queries: 5
    min_word_count: 800

    # Output settings
    branch_prefix: "draft/"
    artifacts_path: "drafts/artifacts/"
    create_pr: true
    pr_labels: ["ai-generated", "draft"]
