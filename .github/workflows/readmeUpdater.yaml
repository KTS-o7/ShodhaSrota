name: Update README with directory tables

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Update README
        run: |
          echo "Updating README..."
          python3 -m scripts.update_readme

      - name: Commit README.md (signed, via GitHub API)
        # Commit through the contents API with GITHUB_TOKEN instead of git push,
        # so GitHub signs the commit and it passes the required-signatures rule.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes to commit"
            exit 0
          fi
          base64 -w0 README.md > "$RUNNER_TEMP/content.b64"
          jq -n \
            --arg message "docs: auto-update README with directory tables" \
            --arg branch "$BRANCH" \
            --arg sha "$(git rev-parse HEAD:README.md)" \
            --rawfile content "$RUNNER_TEMP/content.b64" \
            '{message: $message, branch: $branch, sha: $sha, content: $content}' \
            > "$RUNNER_TEMP/request.json"
          gh api -X PUT "repos/$REPO/contents/README.md" --input "$RUNNER_TEMP/request.json" --jq '.commit.html_url'
