name: Capture Idea to Queue

on:
  repository_dispatch:
    types: [capture_idea]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Parse and append to queue
        env:
          MESSAGE: ${{ github.event.client_payload.message }}
        run: |
          python3 -m scripts.capture_to_queue "$MESSAGE"

      - name: Commit queue.md (signed, via GitHub API)
        # Commit through the contents API with GITHUB_TOKEN instead of git push,
        # so GitHub signs the commit and it passes the required-signatures rule.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- queue.md; then
            echo "No changes to commit"
            exit 0
          fi
          base64 -w0 queue.md > "$RUNNER_TEMP/content.b64"
          jq -n \
            --arg message "chore: capture idea from mobile" \
            --arg branch "$BRANCH" \
            --arg sha "$(git rev-parse HEAD:queue.md)" \
            --rawfile content "$RUNNER_TEMP/content.b64" \
            '{message: $message, branch: $branch, sha: $sha, content: $content}' \
            > "$RUNNER_TEMP/request.json"
          gh api -X PUT "repos/$REPO/contents/queue.md" --input "$RUNNER_TEMP/request.json" --jq '.commit.html_url'
